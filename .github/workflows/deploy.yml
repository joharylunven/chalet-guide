# Déploiement sur GitHub Pages à chaque push sur main (ou à la demande).
# Le test anti-données personnelles s'exécute sur public/ AVANT la compilation
# et sur dist/ APRÈS : un courriel ou un téléphone bloque le déploiement.
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests (contenus, assistant, spa, aperçu, tableau de bord, public/ sans données personnelles)
        run: npm test

      - name: Compilation
        run: npm run build
        env:
          # « ./ » convient à GitHub Pages (routage par hash). Pour un chemin
          # absolu, définir la variable de dépôt VITE_BASE (ex. /chalet-guide/).
          VITE_BASE: ${{ vars.VITE_BASE || './' }}

      - name: Aucune donnée personnelle dans dist/
        run: npx vitest run tests/no-pii.test.ts

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
